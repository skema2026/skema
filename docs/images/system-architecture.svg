<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1184" width="1800" height="1184" font-family="'Pretendard','Pretendard Variable','Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif">
  <title>SKEMA 시스템 구성도</title>
  <!--
    unslop 기준 (11/10): 종이 플래너 톤, 강조색은 파랑 하나(직접 구현한 모듈에만), 굵기 400~600,
    4px 격자, 그림자·검정 띠 없음, 형광펜 밑줄은 '다시 짜기' 한 곳.
    외부 AI(OpenAI)는 쓰지 않는다 (11/13 결정, 예비 경로 상자·점선 화살표 삭제).
    정확도 숫자는 처음 보는 캡처 5장 기준 (11/13 측정, backend/bench). 바뀌면 인식기 상자 아래 두 줄만 바꾼다.
    PNG(2배, 3600px)·PDF는 이 SVG를 Pretendard 글꼴이 있는 Chromium으로 렌더링해 만든다. 글꼴이 없으면 글자 폭이 달라질 수 있다.
  -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#5e554a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text{font-variant-numeric:tabular-nums}
      .zone{fill:#f4f0e8;stroke:#e3ddd2;stroke-width:1.5}
      .zT{font-size:20px;font-weight:600;fill:#1f1b16}
      .zS{font-size:14px;fill:#7b7266}
      .box{fill:#ffffff;stroke:#ddd6ca;stroke-width:1.5}
      .ext{fill:#ebe5da;stroke:#ddd6ca;stroke-width:1.5}
      .core{fill:#ffffff;stroke:#2563eb;stroke-width:2}
      .t{font-size:20px;font-weight:600;fill:#1f1b16}
      .tL{font-size:22px;font-weight:600;fill:#1f1b16}
      .s{font-size:15px;fill:#5e554a}
      .m{font-size:14px;fill:#7b7266}
      .tag{font-size:13px;font-weight:600;fill:#1d4ed8}
      .n{font-size:14px;font-weight:600;fill:#2563eb}
      .st{font-size:17px;font-weight:600;fill:#1f1b16}
      .fact{font-size:15px;font-weight:600;fill:#1f1b16}
      .lbl{font-size:13px;font-weight:500;fill:#5e554a}
      .hair{stroke:#e8e2d8;stroke-width:1.5}
      .ln{stroke:#5e554a;stroke-width:1.6;fill:none}
    </style>
  </defs>

  <rect width="1800" height="1184" fill="#fdfbf7"/>

  <!-- ── 제목 ── -->
  <text x="48" y="92" font-size="40" font-weight="600" fill="#1f1b16" letter-spacing="-0.8">SKEMA 시스템 구성도</text>
  <text x="48" y="130" font-size="18" fill="#5e554a">에타 시간표 캡처 한 장으로 수업을 넣고, 밀린 공부를 다시 짜 주고, 알림까지 보내는 구조</text>

  <g transform="translate(1448,56)">
    <rect x="0.5" y="0.5" width="20" height="20" rx="5" class="core"/><text x="32" y="16" font-size="15" fill="#1f1b16">직접 구현한 핵심 모듈</text>
    <rect x="0.5" y="32.5" width="20" height="20" rx="5" class="box"/><text x="32" y="48" font-size="15" fill="#1f1b16">서버·화면 구성 요소</text>
    <rect x="0.5" y="64.5" width="20" height="20" rx="5" class="ext"/><text x="32" y="80" font-size="15" fill="#1f1b16">외부 서비스</text>
  </g>

  <!-- ── 구역 ── -->
  <rect x="48" y="168" width="300" height="824" rx="16" class="zone"/>
  <text x="72" y="204" class="zT">사용자 기기</text>
  <text x="72" y="228" class="zS">PC · 휴대폰</text>

  <rect x="388" y="168" width="300" height="340" rx="16" class="zone"/>
  <text x="412" y="204" class="zT">Vercel</text>
  <text x="412" y="228" class="zS">프론트엔드 배포</text>

  <rect x="728" y="168" width="680" height="968" rx="16" class="zone"/>
  <text x="752" y="204" class="zT">Railway</text>
  <text x="752" y="228" class="zS">백엔드 · DB (Docker, 인스턴스 1대)</text>

  <rect x="1448" y="168" width="304" height="400" rx="16" class="zone"/>
  <text x="1472" y="204" class="zT">외부 서비스</text>
  <text x="1472" y="228" class="zS">로그인 · 영상 저장</text>

  <!-- ── 사용자 기기 ── -->
  <rect x="72" y="248" width="252" height="136" rx="12" class="box"/>
  <text x="198" y="300" text-anchor="middle" class="t">브라우저 · 홈 화면 앱</text>
  <text x="198" y="330" text-anchor="middle" class="s">PC · 휴대폰 (PWA)</text>
  <text x="198" y="356" text-anchor="middle" class="m">아이폰은 iOS 16.4 이상</text>

  <rect x="72" y="816" width="252" height="152" rx="12" class="box"/>
  <text x="198" y="872" text-anchor="middle" class="t">서비스워커</text>
  <text x="198" y="904" text-anchor="middle" class="s">푸시 알림 표시</text>
  <text x="198" y="930" text-anchor="middle" class="s">누르면 그날 하루 타임라인</text>

  <line x1="198" y1="384" x2="198" y2="816" stroke="#b9b0a3" stroke-width="1.5" stroke-dasharray="4 6"/>
  <rect x="160" y="588" width="76" height="28" rx="6" fill="#f4f0e8"/>
  <text x="198" y="607" text-anchor="middle" class="m">같은 기기</text>

  <!-- ── Vercel ── -->
  <rect x="412" y="248" width="252" height="236" rx="12" class="box"/>
  <text x="538" y="292" text-anchor="middle" class="t">웹앱</text>
  <text x="538" y="320" text-anchor="middle" font-size="15" font-weight="500" fill="#5e554a">Next.js 16 · React 19</text>
  <line x1="436" y1="340" x2="640" y2="340" class="hair"/>
  <text x="538" y="370" text-anchor="middle" class="s">주간 · 하루 · 월간 보기</text>
  <text x="538" y="396" text-anchor="middle" class="s">온보딩 · 리포트</text>
  <text x="538" y="422" text-anchor="middle" class="s">스터디 기록 · 공유 화면</text>
  <text x="538" y="458" text-anchor="middle" class="m">TanStack Query · Zustand</text>

  <!-- ── 브라우저 푸시 서비스 (외부) ── -->
  <rect x="412" y="816" width="252" height="152" rx="12" class="ext"/>
  <text x="538" y="872" text-anchor="middle" class="t">브라우저 푸시 서비스</text>
  <text x="538" y="904" text-anchor="middle" class="s">FCM · APNs · Mozilla</text>
  <text x="538" y="930" text-anchor="middle" class="s">허용 목록 주소만 사용</text>

  <!-- ── Railway: API 서버 ── -->
  <rect x="752" y="248" width="632" height="112" rx="12" class="box"/>
  <text x="1068" y="290" text-anchor="middle" class="t">API 서버 · FastAPI</text>
  <text x="1068" y="320" text-anchor="middle" class="s">인증 · 일정 · 시험 · 시간표 등록 · 스터디 기록 · 공유 · 알림 설정</text>
  <text x="1068" y="344" text-anchor="middle" class="m">Python 3.11 · SQLAlchemy 2 · Alembic</text>

  <!-- 시간표 인식기 (직접 구현) -->
  <rect x="752" y="408" width="308" height="376" rx="12" class="core"/>
  <text x="776" y="442" class="tag">직접 구현</text>
  <text x="776" y="472" class="tL">시간표 인식기</text>
  <text x="776" y="498" class="m">에타 캡처 → 요일·시간·과목·강의실</text>
  <line x1="776" y1="518" x2="1036" y2="518" class="hair"/>
  <text x="776" y="550" class="n">01</text><text x="808" y="550" class="st">OpenCV</text>
  <text x="808" y="575" class="s">격자·블록 위치 → 요일·시간</text>
  <text x="776" y="614" class="n">02</text><text x="808" y="614" class="st">Tesseract 5</text>
  <text x="808" y="639" class="s">블록 안 글자 읽기 (한국어·영어)</text>
  <text x="776" y="678" class="n">03</text><text x="808" y="678" class="st">보정 규칙</text>
  <text x="808" y="703" class="s">과목명 정리 · 수업/개인 추천</text>
  <line x1="776" y1="724" x2="1036" y2="724" class="hair"/>
  <text x="776" y="750" class="fact">시간 56/56 · 과목명 54/56 · 강의실 46/47</text>
  <text x="776" y="772" font-size="13" fill="#7b7266">처음 보는 캡처 5장 기준 (개발에 안 쓴 캡처)</text>

  <!-- 일정 계산 엔진 (직접 구현) -->
  <rect x="1076" y="408" width="308" height="376" rx="12" class="core"/>
  <text x="1100" y="442" class="tag">직접 구현</text>
  <text x="1100" y="472" class="tL">일정 계산 엔진</text>
  <text x="1100" y="498" class="m">규칙 기반 · 외부 AI 없음</text>
  <line x1="1100" y1="518" x2="1360" y2="518" class="hair"/>
  <text x="1100" y="550" class="n">01</text><text x="1132" y="550" class="st">빈 시간 계산</text>
  <text x="1132" y="575" class="s">30분 칸, 수면·수업·개인 일정 제외</text>
  <text x="1100" y="614" class="n">02</text><text x="1132" y="614" class="st">공부 블록 배치</text>
  <text x="1132" y="639" class="s">시험 전날까지 저녁 → 오후 → 오전</text>
  <text x="1100" y="678" class="n">03</text><text x="1132" y="678" class="st">다시 짜기</text>
  <text x="1132" y="703" class="s">못 한 블록만 옮김, 미리보기 → 적용</text>
  <line x1="1100" y1="724" x2="1360" y2="724" class="hair"/>
  <text x="1100" y="750" class="fact">같은 상태면 항상 같은 결과</text>
  <text x="1100" y="772" font-size="13" fill="#7b7266">자리가 모자라면 미리보기에서 알려 줌</text>

  <!-- 알림 스케줄러 -->
  <rect x="752" y="816" width="308" height="152" rx="12" class="box"/>
  <text x="906" y="856" text-anchor="middle" class="t">알림 스케줄러</text>
  <text x="906" y="880" text-anchor="middle" font-size="15" font-weight="500" fill="#5e554a">APScheduler</text>
  <text x="906" y="910" text-anchor="middle" class="m">5분마다: 시작 전 · 미완료 · 좋아요</text>
  <text x="906" y="932" text-anchor="middle" class="m">매일: 시험 D-7·D-3·D-1·당일, 응원</text>
  <text x="906" y="954" text-anchor="middle" class="m">매주 월요일: 주간 리포트</text>

  <!-- MySQL -->
  <g transform="translate(1076,816)">
    <path d="M0.75,20 V132 A153.25,20 0 0 0 307.25,132 V20" fill="#ffffff" stroke="#ddd6ca" stroke-width="1.5"/>
    <ellipse cx="154" cy="20" rx="153.25" ry="20" fill="#f4f0e8" stroke="#ddd6ca" stroke-width="1.5"/>
    <text x="154" y="82" text-anchor="middle" class="t">MySQL 8</text>
    <text x="154" y="108" text-anchor="middle" class="s">사용자 · 일정 · 시험 · 기록</text>
    <text x="154" y="130" text-anchor="middle" class="s">푸시 구독 · 공유 링크</text>
  </g>

  <!-- 보안 -->
  <rect x="752" y="1000" width="632" height="112" rx="12" class="box"/>
  <text x="776" y="1036" font-size="17" font-weight="600" fill="#1f1b16">보안</text>
  <text x="776" y="1066" class="s">JWT 인증 · 소셜 로그인 state 검증 · 로그인·인식 요청 횟수 제한</text>
  <text x="776" y="1092" class="s">업로드 이미지 사전 검사 · 비공개 기록·공유 범위 제한 · 회귀 테스트</text>

  <!-- ── 외부 서비스 ── -->
  <rect x="1472" y="248" width="256" height="136" rx="12" class="ext"/>
  <text x="1600" y="300" text-anchor="middle" class="t">소셜 로그인</text>
  <text x="1600" y="330" text-anchor="middle" class="s">카카오 · 네이버 · 구글</text>
  <text x="1600" y="356" text-anchor="middle" class="m">OAuth 2.0</text>

  <rect x="1472" y="408" width="256" height="136" rx="12" class="ext"/>
  <text x="1600" y="460" text-anchor="middle" class="t">Cloudflare R2</text>
  <text x="1600" y="490" text-anchor="middle" class="s">스터디 인증 영상 (비공개)</text>
  <text x="1600" y="516" text-anchor="middle" class="m">1시간 서명 주소로 재생</text>


  <!-- ── 대표 흐름 ── -->
  <rect x="48" y="1024" width="640" height="112" rx="16" class="zone"/>
  <text x="72" y="1060" font-size="17" font-weight="600" fill="#1f1b16">대표 흐름</text>
  <text x="160" y="1060" class="m">사진 한 장에서 밀려도 다시 짜 주는 계획까지</text>
  <g font-size="15" font-weight="500" fill="#1f1b16">
    <text x="72" y="1090" class="m">01</text><text x="72" y="1114">캡처 업로드</text>
    <text x="194" y="1090" class="m">02</text><text x="194" y="1114">인식·확인</text>
    <text x="316" y="1090" class="m">03</text><text x="316" y="1114">시험 입력</text>
    <text x="438" y="1090" class="m">04</text><text x="438" y="1114">블록 배치</text>
    <rect x="558" y="1104" width="60" height="12" rx="2" fill="#facc15" fill-opacity="0.5"/>
    <text x="560" y="1090" class="m">05</text><text x="560" y="1114">다시 짜기</text>
  </g>
  <g class="ln">
    <line x1="160" y1="1109" x2="182" y2="1109" marker-end="url(#arr)"/>
    <line x1="276" y1="1109" x2="304" y2="1109" marker-end="url(#arr)"/>
    <line x1="394" y1="1109" x2="426" y2="1109" marker-end="url(#arr)"/>
    <line x1="516" y1="1109" x2="548" y2="1109" marker-end="url(#arr)"/>
  </g>

  <!-- ── 화살표 ── -->
  <g class="ln">
    <!-- 브라우저 → 웹앱 -->
    <line x1="324" y1="316" x2="410" y2="316" marker-end="url(#arr)"/>
    <!-- 웹앱 → API -->
    <line x1="664" y1="304" x2="750" y2="304" marker-end="url(#arr)"/>
    <!-- API → 소셜 로그인 -->
    <line x1="1384" y1="304" x2="1470" y2="304" marker-end="url(#arr)"/>
    <!-- API → R2 -->
    <path d="M1384,340 C1428,340 1426,476 1470,476" marker-end="url(#arr)"/>
    <!-- API → 인식기 / 엔진 -->
    <line x1="906" y1="360" x2="906" y2="406" marker-end="url(#arr)"/>
    <line x1="1230" y1="360" x2="1230" y2="406" marker-end="url(#arr)"/>
    <!-- 엔진 ↔ DB -->
    <line x1="1230" y1="786" x2="1230" y2="814" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <!-- DB → 스케줄러 -->
    <line x1="1076" y1="892" x2="1062" y2="892" marker-end="url(#arr)"/>
    <!-- 스케줄러 → 푸시 서비스 → 서비스워커 -->
    <line x1="752" y1="892" x2="666" y2="892" marker-end="url(#arr)"/>
    <line x1="412" y1="892" x2="326" y2="892" marker-end="url(#arr)"/>
  </g>
  <g class="lbl" text-anchor="middle">
    <text x="367" y="304">HTTPS</text>
    <text x="707" y="292">REST · JWT</text>
    <text x="1427" y="292">OAuth</text>
    <text x="709" y="880">푸시 전송</text>
    <text x="709" y="916">VAPID</text>
    <text x="369" y="880">알림</text>
  </g>
</svg>
